name: "Rubocop"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '22 7 * * 2'

jobs:
  rubocop:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Install Ruby and Rubocop
      run: |
        sudo apt-get update
        sudo apt-get install -y ruby ruby-dev rubocop

    - name: Run Rubocop
      run: rubocop
