name: Upload qemu-virgl Homebrew tap

on:
  workflow_dispatch:

# Serialize the publish and verify jobs against any concurrent reruns of
# this workflow. cancel-in-progress: false so a re-run waits for the
# previous publish to finish — never cancel a half-completed publish
# (the bottle-block commit may have already been pushed but not yet
# folded, and cancelling then would leave main in a non-one-commit state).
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

# All three macOS jobs in the publish chain (publish, release, verify)
# run on the same `macos-NN` image. When bumping to a new macOS generation,
# update this one commit (see AGENTS.md):
#
#   sed -i '' 's/macos-26/macos-27/g' .github/workflows/publish.yml
#
# `env:` cannot be referenced inside `runs-on:` (the expression context is
# limited there), so the value is inlined in each job and the `sed` keeps
# the three sites in sync. Don't edit the runner labels by hand — always
# use the sed so a partial migration can't leave one job on the old image.

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Compute release tag
        id: tag
        run: |
          # Fixed release tag => stable bottle root_url. `brew bottle
          # --keep-old` aborts if root_url changes between builds, so the
          # release/tag is pruned and recreated under the same name each run
          # rather than minted per-run. See AGENTS.md.
          TAG="latest"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  publish:
    needs: setup
    runs-on: macos-26
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
      HOMEBREW_NO_ANALYTICS: 1
      # Build everything from source so the macOS 26 (Tahoe) runner never
      # aborts on "no bottle available!" for dependencies (e.g. openssl@3,
      # orc, pygobject3).
      HOMEBREW_BUILD_FROM_SOURCE: 1
      # Disable partial/corrupted git clones from large upstream repos (e.g.
      # ANGLE). Homebrew's partial-clone optimization can omit tree objects,
      # which makes `git checkout -f <tree-sha>` fail with "unable to read tree".
      HOMEBREW_NO_GIT_PARTIAL_CLONE: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up tap
        run: |
          # Tap the repository using file:// URL to use local checkout
          brew tap milesbuckton/qemu-virgl file://${{ github.workspace }}
          brew trust milesbuckton/qemu-virgl
          # Verify tap is set up correctly
          brew tap-info milesbuckton/qemu-virgl

      - name: Clear Homebrew cache
        # Remove any cached repo state so every build clones fresh source
        # checkouts and never inherits a corrupted git object from a prior run.
        run: |
          brew cleanup -s || true
          rm -rf "$(brew --cache)"
          rm -rf ~/Library/Caches/Homebrew/*-git

      - name: Install gn for ANGLE build
        run: |
          # gn depends on python@3.14. The GitHub runners ship a preinstalled
          # idle3.14 at /opt/homebrew that blocks the default brew link step,
          # which would abort `brew install gn` and skip everything after it.
          # Install + force-link python@3.14 FIRST, so gn's dependency install
          # finds it already linked.
          brew install python@3.14 || true
          brew link --overwrite --force python@3.14
          # ca-certificates is a transitive dependency of gn. Its post-install
          # step can fail harmlessly on CI (cert bundle refresh), which would
          # otherwise make `brew install gn` return non-zero. Install it first
          # and run its post-install so it isn't re-triggered later.
          brew install ca-certificates || true
          brew postinstall ca-certificates || true
          # gn's dependency tree (via python@3.14) pulls openssl@3. The runner
          # ships an outdated openssl@3, and gn's --build-from-source install
          # tries to upgrade it to the latest, which is broken on the macOS 26
          # (Tahoe) arm64 runner: the API-source formula read errors with
          # "unknown keyword: :overwrite". Pinning fails too ("requires the
          # latest version of pinned dependencies").
          #
          # Strategy: get openssl@3 to its latest buildable/pourable state
          # BEFORE gn runs, so gn's resolution finds it satisfied and does not
          # attempt an upgrade mid-install. Try the bottle upgrade first; if
          # that fails, fall back to a source build of openssl@3. Doing this
          # here, before gn, means gn never triggers the broken upgrade path
          # itself.
          brew upgrade openssl@3 || brew install --build-from-source openssl@3 || true
          # Install gn from our tap. rapidjson is pulled in automatically as a
          # build dependency of libangle, so installing it explicitly here is
          # unnecessary.
          brew install --build-from-source --formula milesbuckton/qemu-virgl/gn || true

      - name: Build dependencies
        run: |
          brew install --build-bottle --formula milesbuckton/qemu-virgl/libangle --verbose
          brew install --build-bottle --formula milesbuckton/qemu-virgl/libepoxy-angle --verbose
          brew install --build-bottle --formula milesbuckton/qemu-virgl/virglrenderer --verbose

      - name: Build qemu-virgl
        run: |
          # Install qemu-virgl. A genuine build failure must surface here.
          # We deliberately do NOT `brew link` here: qemu-virgl intentionally
          # shadows the standard `qemu`/`libepoxy` kegs, and forcing a link on
          # the runner would fail (and isn't needed for bottling). The test and
          # verify steps below invoke the binaries via their Cellar path.
          # libepoxy-angle is keg_only, so it does not collide with the standard
          # libepoxy pulled in transitively by qemu-virgl.
          # gdk-pixbuf and ca-certificates (transitive deps pulled in by gnutls/
          # glib, etc.) can have post-install steps that fail benignly on CI
          # runners (cert refresh, font cache rebuild); pre-install them and
          # run their post-install so the qemu-virgl install below doesn't
          # re-trigger (and fail on) their post-install. The qemu-virgl install
          # itself is allowed to exit non-zero: a genuine compile/link failure
          # surfaces in the Test step below (which runs the built binary).
          brew install gdk-pixbuf ca-certificates || true
          brew postinstall gdk-pixbuf ca-certificates || true
          brew install --build-bottle --formula milesbuckton/qemu-virgl/qemu-virgl --verbose || true

      - name: Test installation
        run: |
          QV=$(brew --prefix milesbuckton/qemu-virgl/qemu-virgl)/bin
          "$QV/qemu-system-aarch64" --version
          "$QV/qemu-img" --version

      - name: Verify OpenGL/ANGLE library linking
        run: |
          set +e
          QBIN=$(brew --prefix milesbuckton/qemu-virgl/qemu-virgl)/bin/qemu-system-aarch64
          echo "=== Checking QEMU library dependencies ==="
          otool -L "$QBIN" | grep -E "(libangle|libepoxy|virgl)" || echo "⚠️  No OpenGL libraries found in dependencies"

          echo -e "\n=== Checking rpaths in QEMU binary ==="
          otool -l "$QBIN" | grep -A2 LC_RPATH | grep path || echo "⚠️  No rpaths found"

          echo -e "\n=== Verifying ANGLE libraries exist ==="
          ls -lh "$(brew --prefix)/opt/libangle/lib/libGLESv2.dylib" || echo "⚠️  libGLESv2.dylib not found"
          ls -lh "$(brew --prefix)/opt/libangle/lib/libEGL.dylib" || echo "⚠️  libEGL.dylib not found"

          echo -e "\n=== Verifying libepoxy-angle exists ==="
          ls -lh "$(brew --prefix)/opt/libepoxy-angle/lib/libepoxy.0.dylib" || echo "⚠️  libepoxy not found"

          echo -e "\n=== Verifying virglrenderer exists ==="
          ls -lh "$(brew --prefix)/opt/virglrenderer/lib/libvirglrenderer.1.dylib" || echo "⚠️  virglrenderer not found"

          echo -e "\n=== Checking QEMU build configuration ==="
          "$QBIN" -display help 2>&1 | grep -E "(cocoa|sdl)" || echo "⚠️  Display backends not found"

          echo -e "\n=== Checking QEMU device support ==="
          "$QBIN" -device help 2>&1 | grep virtio-gpu || echo "⚠️  virtio-gpu devices not found"
          set -e

      - name: Compute release tag
        id: tag
        run: |
          TAG="latest"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Create bottles
        env:
          RELEASE_TAG: ${{ needs.setup.outputs.release_tag }}
        run: |
          mkdir -p bottles
          # The bottle JSON's root_url must point at OUR GitHub release, not
          # Homebrew's default domain (ghcr.io/homebrew/core). `brew bottle
          # --merge` reads root_url from the JSON (the --root-url flag is ignored
          # in merge mode), and bottle_output omits root_url when it equals the
          # default domain — so without --root-url here the formula would end up
          # with no root_url and `brew install` would 404 on ghcr.io.
          ROOT_URL="https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG"
          # --keep-old reuses each formula's hand-authored `rebuild N` verbatim
          # instead of computing prev+1 from git history. The rebuild number is
          # a macOS-generation marker (see AGENTS.md): it only moves when the
          # formulae are edited deliberately, so reruns never inflate it.
          brew bottle --json --keep-old --root-url "$ROOT_URL" milesbuckton/qemu-virgl/libangle
          brew bottle --json --keep-old --root-url "$ROOT_URL" milesbuckton/qemu-virgl/libepoxy-angle
          brew bottle --json --keep-old --root-url "$ROOT_URL" milesbuckton/qemu-virgl/virglrenderer
          brew bottle --json --keep-old --root-url "$ROOT_URL" milesbuckton/qemu-virgl/qemu-virgl

          # `brew bottle` names archives <formula>--<version>.<tag>.bottle.<rebuild>.tar.gz
          # (double dash), but Homebrew resolves the download URL as
          # <formula>-<version>.<tag>.bottle.<rebuild>.tar.gz (single dash). Rename the
          # double dash to a single dash so `brew install` can find the archive on the
          # release. Match *.bottle*.tar.gz (not *.bottle.tar.gz) because brew bottle
          # appends a rebuild suffix when the formula has been rebuilt: e.g. *.bottle.5.tar.gz.
          for file in ./*.bottle*.tar.gz; do
            if [ -f "$file" ]; then
              newname=${file//--/-}
              if [ "$file" != "$newname" ]; then
                echo "Renaming: $file -> $newname"
                mv "$file" "$newname"
              fi
            fi
          done

          mv ./*.bottle*.tar.gz ./*.bottle.json bottles/ 2>/dev/null || true

      - name: Upload bottles as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bottles-arm64_tahoe
          path: bottles/

  release:
    needs: [publish, setup]
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all bottle artifacts
        uses: actions/download-artifact@v8
        with:
          path: all-bottles
          pattern: bottles-*
          merge-multiple: true

      - name: Create release and upload bottles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.setup.outputs.release_tag }}
        run: |
          BUILD_STAMP="$(date -u +%Y%m%d.%H%M%S)"

          # Keep at most one release: delete any previous release so re-runs never
          # accumulate. We deliberately drop --cleanup-tag: the `latest` tag stays
          # intact at its current commit and the release is re-attached to it.
          #
          # WARNING: if the `latest` TAG is missing (user deleted it, first-ever
          # run), `gh release create` below would create a DRAFT release whose
          # assets live under .../releases/download/untagged-<sha>/... instead of
          # .../releases/download/latest/..., which breaks the bottle root_url.
          # Ensure the tag exists (pointing at origin/main) before creating the
          # release so it is always created non-draft under the fixed tag.
          OLD_TAG=$(gh release list --repo ${{ github.repository }} --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
          if [ -n "$OLD_TAG" ]; then
            echo "Pruning previous release (keeping tag): $OLD_TAG"
            gh release delete "$OLD_TAG" --repo ${{ github.repository }} --yes || true
          fi

          if ! git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "Tag $RELEASE_TAG is missing; recreating it at origin/main"
            git fetch origin main
            git tag -f "$RELEASE_TAG" origin/main
            git push --force origin "refs/tags/$RELEASE_TAG"
          fi

          # Create release
          gh release create "$RELEASE_TAG" \
            --repo ${{ github.repository }} \
            --title "Bottles $BUILD_STAMP" \
            --notes "Pre-built bottles for macOS Tahoe (Apple Silicon), built $BUILD_STAMP" \
            all-bottles/*.bottle*.tar.gz

      - name: Set up tap
        run: |
          brew tap milesbuckton/qemu-virgl file://${{ github.workspace }}
          brew trust milesbuckton/qemu-virgl

      - name: Merge bottle blocks into formulae
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.setup.outputs.release_tag }}
        run: |
          cd ${{ github.workspace }}
          for formula in libangle libepoxy-angle virglrenderer qemu-virgl; do
            # Collect every bottle JSON produced for this formula and merge them
            # ALL in a single `brew bottle --merge` call. `brew bottle --merge`
            # REPLACES the formula's bottle block with the tags from the JSON(s)
            # given in that invocation; it does not read the block written by a
            # previous call. Merging one JSON per call would therefore drop
            # every arch but the last one processed, so if multiple JSONs are
            # ever present (e.g. a future arch is added) they must be passed
            # together. Today the workflow only builds arm64_tahoe, so this
            # loop normally finds a single JSON per formula.
            jsons=()
            for json in all-bottles/*"${formula}"*.bottle.json; do
              [ -f "$json" ] || continue
              jsons+=("$json")
            done
            if [ ${#jsons[@]} -gt 0 ]; then
              echo "Merging ${jsons[*]} for $formula"
              brew bottle --merge --write --root-url "https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG" "${jsons[@]}"
            fi
          done
          # brew bottle --merge --write updates the tap clone under
          # $(brew --repository)/Library/Taps, so copy the merged formulae back
          # into the workspace before committing.
          cp "$(brew --repository)/Library/Taps/milesbuckton/homebrew-qemu-virgl/Formula/"*.rb Formula/

      - name: Amend bottle blocks into root commit
        run: |
          cd ${{ github.workspace }}
          git config user.name "${{ github.actor }}"
          git config user.email "miles.buckton@gmail.com"
          git add Formula/
          if git diff --cached --quiet; then
            echo "No formula changes to amend"
          else
            git commit --amend --no-edit
            git push --force-with-lease origin main
            git tag -f latest HEAD
            git push --force origin latest
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: brew-logs-publish
          path: |
            ~/Library/Logs/Homebrew/*.log
            ~/Library/Logs/Homebrew/*/*.log
            ~/Library/Caches/Homebrew/Logs/*.log

  verify:
    # Run the bottle-install + smoke-test path against the bottles that the
    # `release` job just published. Serializes after `release` so this job
    # always exercises the bottles from the same workflow run (the `latest`
    # release is overwritten on every publish, so an out-of-order verify job
    # could otherwise test stale bottles from a previous run).
    needs: release
    runs-on: macos-26
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
      HOMEBREW_NO_ANALYTICS: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Refresh to the latest commit on main. The `release` job (which this
      # job depends on) may have pushed a fresh "Update bottle blocks"
      # commit between when the workflow run started and when this job
      # runs, so we explicitly fetch + reset to origin/main before
      # installing. Without this, the bottled formulae would still match
      # the run's HEAD SHA at workflow start, not the bottle-block update
      # the release job just committed.
      - name: Refresh to latest main
        run: git fetch origin main && git reset --hard origin/main

      - name: Set up tap
        run: |
          brew tap milesbuckton/qemu-virgl file://${{ github.workspace }}
          brew trust milesbuckton/qemu-virgl
          brew tap-info milesbuckton/qemu-virgl

      # Clear cache so a stale pour doesn't satisfy the install. The
      # `publish` job already cleared its cache, but `verify` is a fresh
      # job and may share an image with other workflows; clear defensively.
      - name: Clear Homebrew cache
        run: |
          brew cleanup -s || true
          rm -rf "$(brew --cache)"
          rm -rf ~/Library/Caches/Homebrew/*-git

      # Bottle-install path: pours the qemu-virgl bottle just produced by the
# `release` job (after the Refresh-to-latest-main step fetches the
# bottle-block commit) and smoke-tests the binary. This is the workflow's
# end-to-end correctness check.
      - name: Install from bottles
        run: |
          echo "Installing pre-built bottles..."
          brew install milesbuckton/qemu-virgl/qemu-virgl

      - name: Test QEMU basic functionality
        run: |
          QV=$(brew --prefix milesbuckton/qemu-virgl/qemu-virgl)/bin
          "$QV/qemu-system-aarch64" --version
          "$QV/qemu-img" --version
          # Smoke test: run for a few seconds and kill. Background + sleep
          # instead of `timeout` because GNU timeout may not be installed
          # on all macOS runners.
          "$QV/qemu-system-aarch64" -machine virt -accel tcg -nographic -m 512M &
          QEMU_PID=$!
          sleep 5
          kill "$QEMU_PID" 2>/dev/null || true
          wait "$QEMU_PID" 2>/dev/null || true

      - name: Verify OpenGL/ANGLE library linking
        run: |
          set +e
          QBIN=$(brew --prefix milesbuckton/qemu-virgl/qemu-virgl)/bin/qemu-system-aarch64
          echo "=== Checking QEMU library dependencies ==="
          otool -L "$QBIN" | grep -E "(libangle|libepoxy|virgl)" || echo "⚠️  No OpenGL libraries found in dependencies"

          echo -e "\n=== Checking rpaths in QEMU binary ==="
          otool -l "$QBIN" | grep -A2 LC_RPATH | grep path || echo "⚠️  No rpaths found"

          echo -e "\n=== Verifying ANGLE libraries exist ==="
          ls -lh "$(brew --prefix)/opt/libangle/lib/libGLESv2.dylib" || echo "⚠️  libGLESv2.dylib not found"
          ls -lh "$(brew --prefix)/opt/libangle/lib/libEGL.dylib" || echo "⚠️  libEGL.dylib not found"

          echo -e "\n=== Verifying libepoxy-angle exists ==="
          ls -lh "$(brew --prefix)/opt/libepoxy-angle/lib/libepoxy.0.dylib" || echo "⚠️  libepoxy not found"

          echo -e "\n=== Verifying virglrenderer exists ==="
          ls -lh "$(brew --prefix)/opt/virglrenderer/lib/libvirglrenderer.1.dylib" || echo "⚠️  virglrenderer not found"

          echo -e "\n=== Checking QEMU build configuration ==="
          "$QBIN" -display help 2>&1 | grep -E "(cocoa|sdl)" || echo "⚠️  Display backends not found"

          echo -e "\n=== Checking QEMU device support ==="
          "$QBIN" -device help 2>&1 | grep virtio-gpu || echo "⚠️  virtio-gpu devices not found"
          set -e

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: brew-logs-verify
          path: |
            ~/Library/Logs/Homebrew/*.log
            ~/Library/Logs/Homebrew/*/*.log
            ~/Library/Caches/Homebrew/Logs/*.log
